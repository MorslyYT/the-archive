<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101114">
  <title>THE ARCHIVE // CASE 001</title>
  <style>
    :root { color-scheme: dark; --bg:#101114; --panel:#191b20; --line:#383b43; --muted:#a4a7b0; --red:#c94b4b; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
      background:radial-gradient(ellipse at top,#28232a 0%,#101114 58%); color:#f2f0eb;
      font-family:Georgia,"Times New Roman",serif; }
    main { width:min(100%,560px); border:1px solid var(--line); background:rgba(25,27,32,.96);
      padding:clamp(24px,6vw,48px); box-shadow:0 24px 80px #0009; }
    .top { display:flex; justify-content:space-between; gap:12px; align-items:center; }
    .eyebrow,.stamp,.small { font-family:Arial,sans-serif; letter-spacing:.14em; text-transform:uppercase; }
    .eyebrow { color:var(--muted); font-size:11px; }
    .stamp { border:1px solid var(--red); color:#ff8c8c; padding:7px 9px; font-size:10px; transform:rotate(-3deg); }
    h1 { font-size:clamp(34px,9vw,54px); letter-spacing:.06em; margin:38px 0 4px; font-weight:normal; }
    .case { color:var(--muted); font:12px Arial,sans-serif; letter-spacing:.18em; }
    .rule { border:0; border-top:1px solid var(--line); margin:28px 0; }
    h2 { font-size:17px; font-weight:normal; letter-spacing:.08em; }
    p { line-height:1.65; color:#d7d5d0; }
    .notice { background:#111317; border-left:3px solid var(--red); padding:14px 16px; margin:24px 0; }
    .notice p { margin:5px 0; }
    .small { font-size:10px; color:var(--muted); }
    .actions { display:grid; gap:11px; margin-top:22px; }
    button { width:100%; border:1px solid #777; background:#e9e5dc; color:#141414; padding:15px 18px;
      font: bold 12px Arial,sans-serif; letter-spacing:.1em; text-transform:uppercase; cursor:pointer; }
    button.secondary { background:transparent; color:#eee; border-color:var(--line); }
    button:focus-visible { outline:3px solid #ff8c8c; outline-offset:3px; }
    #status { min-height:22px; color:#b9d8b8; font:12px Arial,sans-serif; margin-top:12px; }
    footer { color:#777b84; font:10px Arial,sans-serif; letter-spacing:.1em; margin-top:34px; }
  </style>
</head>
<body>
  <main>
    <div class="top">
      <div class="eyebrow">Recovered access point</div>
      <div class="stamp">Restricted</div>
    </div>
    <h1>THE ARCHIVE</h1>
    <div class="case">CASE NUMBER // 001</div>
    <hr class="rule">
    <h2>ACCESS REQUESTED</h2>
    <p>The photograph has been recovered.</p>
    <div class="notice">
      <div class="small">Required action</div>
      <p>Notify the archive administrator that the first record has been located.</p>
    </div>
    <div class="actions">
      <button id="send">Send verification SMS</button>
      <button class="secondary" id="copy">Copy message instead</button>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
    <footer>END OF TRANSMISSION // DO NOT DISTRIBUTE</footer>
  </main>
  <script>
    const phone = "+38641611706";
    const message = "ARCHIVE ACCESS REQUESTED. Photograph recovered. I am ready to proceed. CASE: 001";
    const encoded = encodeURIComponent(message);
    const isApple = /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    // iOS commonly uses &body=; Android commonly uses ?body=.
    const smsLink = isApple
      ? `sms:${phone}&body=${encoded}`
      : `sms:${phone}?body=${encoded}`;

    document.getElementById("send").addEventListener("click", () => {
      window.location.href = smsLink;
      document.getElementById("status").textContent =
        "If your messaging app did not open, use “Copy message instead” and send it to the number shown in your SMS app.";
    });

    document.getElementById("copy").addEventListener("click", async () => {
      const status = document.getElementById("status");
      try {
        await navigator.clipboard.writeText(message);
        status.textContent = "Message copied. Send it by SMS to +386 41 611 706.";
      } catch (e) {
        status.textContent = "Copy unavailable. Please type: " + message + " — send to +386 41 611 706.";
      }
    });
  </script>
</body>
</html>
